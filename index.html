        return PRODUCTS.filter(p => {

          const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||

          return matchCat && matchSearch;
        });

        const itemOpt = option || product.sizes[0];
        const itemColor = color || (product.colors ? product.colors[0] : "Estándar");
        const key = `${product.id}-${itemOpt}-${itemColor}`;

        setCart(prev => {
          const idx = prev.findIndex(item => item.key === key);
          if (idx > -1) {
            const copy = [...prev];
            copy[idx].quantity += qty;
            return copy;
          }
          return [...prev, {
            key,
            id: product.id,
            name: product.name,
            price: product.price,
            image: product.image,
            option: itemOpt,
            color: itemColor,
            quantity: qty
          }];
        });
        notify(`¡Añadido! ${product.name}`);
      };

      // Total calculations in Soles S/.
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

        setProductOption(p.sizes[0]);

        setProductQty(1);

                <div className="p-3 bg-ender-b  g space-y-2 text-xs">
                  <div className="bg-ender-card p-2.5 rounded-2xl border border-ender-border text-gray-200 text-[11px] leading-relaxed">
                    👋 ¡Hola! ¿Quieres encargar una comisión, preguntar stock de prints/standees o coordinar pago por Yape?
                  </div>

                  <div className="space-y-1">
                    <button
                      onClick={() => sendCustomWp("Hola Ender! Quisiera consultar precios y cupos para una comisión de dibujo.")}
                      className="w-full text-left p-1.5 rounded-xl bg-ender-card hover:bg-emerald-950/40 text-emerald-400 border border-emerald-900/40 text-[11px]"
                    >
                      🎨 Consultar Comisiones
                    </button>
                    <button
                      onClick={() => sendCustomWp("Hola! Quisiera saber el costo de envío a mi provincia o si entregas en la próxima feria.")}
                      className="w-full text-left p-1.5 rounded-xl bg-ender-card hover:bg-emerald-950/40 text-emerald-400 border border-emerald-900/40 text-[11px]"
                    >
                      📦 Envíos y Entrega en Feria
                    </button>
                  </div>
                </div>

                <div className="p-2 bg-ender-card border-t border-ender-border flex items-center gap-1.5">
                  <input
                    type="text"
                    placeholder="Escribe tu mensaje..."
                    value={wpMsg}
                    onChange={(e) => setWpMsg(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && sendCustomWp()}
                    className="flex-1 bg-ender-bg text-xs text-white placeholder-gray-500 rounded-xl px-3 py-1.5 border border-ender-border focus:outline-none focus:border-emerald-500"
                  />
                  <button
                    onClick={() => sendCustomWp()}
                    className="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-xs"
                  >
                    <i className="fa-solid fa-paper-plane"></i>
                  </button>
                </div>
              </div>
            )}

            {/* Trigger Button */}
            <button
              onClick={() => setIsWpOpen(!isWpOpen)}
              className="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-2xl border border-white/20 transition transform hover:scale-105"
              aria-label="WhatsApp Chat"
            >
              <i className="fa-brands fa-whatsapp text-2xl sm:text-3xl"></i>
            </button>
          </div>

          {/* Mobile Dock Navigation Bar */}
          <div className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-ender-bg/95 backdrop-blur-lg border-t border-ender-border px-4 py-2 flex items-center justify-around text-xs">
            <button
              onClick={() => { setSelectedCategory("Todos"); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
              className="flex flex-col items-center gap-0.5 text-gray-400 hover:text-white"
            >
              <i className="fa-solid fa-house text-sm"></i>
              <span className="text-[10px]">Inicio</span>
            </button>

            <a
              href="#catalogo"
              className="flex flex-col items-center gap-0.5 text-gray-400 hover:text-white"
            >
              <i className="fa-solid fa-layer-group text-sm"></i>
              <span className="text-[10px]">Catálogo</span>
            </a>

            <button
              onClick={() => setIsCartOpen(true)}
              className="flex flex-col items-center gap-0.5 text-ender-accent relative"
            >
              <i className="fa-solid fa-basket-shopping text-sm"></i>
              <span className="text-[10px]">Carrito</span>
              {cartCount > 0 && (
                <span className="absolute -top-1 right-2 bg-ender-accent text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center">
                  {cartCount}
                </span>
              )}
            </button>

            <button
              onClick={() => setIsWpOpen(true)}
              className="flex flex-col items-center gap-0.5 text-emerald-400"
            >
              <i className="fa-brands fa-whatsapp text-sm"></i>
              <span className="text-[10px]">WhatsApp</span>
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
